<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ee5522" />

    <title>ZINGOS Fried Chicken | Crispy Chicken, Burgers, Wraps &amp; More</title>
    <meta
      name="description"
      content="Order crispy fried chicken, burgers, wraps, pizzas, fries, combos and more from ZINGOS Fried Chicken. Build your order and send it straight to us on WhatsApp."
    />

    <link rel="canonical" href="%SITE_URL%/" />

    <link rel="icon" href="/favicon-32.png" sizes="32x32" />
    <link rel="icon" href="/favicon-512.png" sizes="512x512" />
    <link rel="apple-touch-icon" href="/favicon-180.png" />

    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ZINGOS Fried Chicken" />
    <meta property="og:title" content="ZINGOS Fried Chicken | Crispy. Bold. Zingos." />
    <meta
      property="og:description"
      content="Freshly fried chicken, loaded combos, burgers, wraps, pizza and bubble tea. Order on WhatsApp for pickup or delivery."
    />
    <meta property="og:image" content="%SITE_URL%/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="ZINGOS Fried Chicken - crispy chicken, a zinger burger, loaded fries and a mojito"
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ZINGOS Fried Chicken" />
    <meta
      name="twitter:description"
      content="Freshly fried chicken, loaded combos, burgers, wraps, pizza and bubble tea."
    />
    <meta name="twitter:image" content="%SITE_URL%/og-image.jpg" />

    <!-- Type: a chunky playful display face for headings, a clean rounded
         geometric sans for everything else - matching the printed menu. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Poppins:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <link rel="preload" as="image" href="/images/products/hero.webp" />
  </head>

  <body>
    <a class="skip-link" href="#menu">Skip to the menu</a>

    <header data-navbar></header>

    <main id="top">
      <section data-hero aria-labelledby="hero-title"></section>
      <nav data-categories aria-label="Browse by category"></nav>
      <section data-featured aria-label="Fan favourites"></section>
      <section data-menu aria-label="Menu"></section>
      <section data-about aria-label="About ZINGOS"></section>
      <section data-order-cta aria-label="Start an order"></section>
      <section data-location aria-label="Location and contact"></section>
    </main>

    <footer data-footer></footer>

    <noscript>
      <div style="padding: 6rem 1.5rem 2rem; text-align: center; font-family: system-ui">
        <h1>ZINGOS Fried Chicken</h1>
        <p>
          Crispy fried chicken, burgers, wraps, pizza, loaded fries and bubble tea.
          Please enable JavaScript to browse the menu and place an order, or contact
          the restaurant directly on WhatsApp.
        </p>
      </div>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
